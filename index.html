function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}
const imgs={};
function makeBird(id,wf){
  const k=id+wf;if(imgs[k])return imgs[k];
  const sk=BIRDS[id],w=26,h=19,o=document.createElement('canvas');o.width=w;o.height=h;const x=o.getContext('2d');
  const ell=(i,j,cx,cy,rx,ry)=>((i+.5-cx)/rx)**2+((j+.5-cy)/ry)**2<=1;
  const body=(i,j)=>ell(i,j,12,9.6,11.6,8.3),beak=(i,j)=>i>=19&&i<=25&&j>=8&&j<=14&&!(i>=24&&(j===8||j===14));
  const solid=(i,j)=>i>=0&&j>=0&&i<w&&j<h&&(body(i,j)||beak(i,j));
  const hi=mix(sk.B,'#ffffff',.35),sh=mix(sk.B,'#7a2a00',.3),px=(i,j,col)=>{x.fillStyle=col;x.fillRect(i,j,1,1);};
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    if(!solid(i,j))continue;
    if(!solid(i-1,j)||!solid(i+1,j)||!solid(i,j-1)||!solid(i,j+1)){px(i,j,D);continue;}
    if(beak(i,j)&&i>=19){px(i,j,j===9?'#ff8a55':j<=10?'#f0402b':'#c8281a');continue;}
    let col=j<=3?hi:j>=14?sh:sk.B;
    if(ell(i,j,10,13.6,7.8,3.8)&&j>=11)col=sk.L;
    if(ell(i,j,17,6.2,4.1,4.5)){col=ell(i,j,17,6.2,3.1,3.5)?'#fff':D;}
    if(ell(i,j,18.4,6.6,1.7,2.3))col=D;
    px(i,j,col);
  }
  const wc=[-3,0,3,0][wf],cy=11.4+wc;
  const wing=(i,j)=>ell(i,j,7.5,cy,5.6,3.5);
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(!wing(i,j))continue;
    px(i,j,(!wing(i-1,j)||!wing(i+1,j)||!wing(i,j-1)||!wing(i,j+1))?D:(j<cy-.5?sk.W:mix(sk.W,'#c9a14a',.25)));}
  if(sk.x==='band'){for(let j=3;j<=4;j++)for(let i=5;i<=21;i++)if(solid(i,j)&&solid(i-1,j)&&solid(i+1,j)&&solid(i,j-1)&&solid(i,j+1))px(i,j,'#e02b3a');}
  if(sk.x==='robot'){px(12,0,'#ff5a36');px(8,5,'#6b7783');px(8,14,'#6b7783');px(13,14,'#6b7783');}
  if(sk.x==='crown'){[10,12,14].forEach(i=>px(i,0,'#ffd23f'));}
  return imgs[k]=o;
}

function drawPet(x2,id,x,yy,s,t){const sp=petSprite(id,Math.floor(t/10)%2),sq=PETS[id].k==='slime'?1+Math.sin(t*.2)*.07:1;x2.save();x2.imageSmoothingEnabled=false;x2.translate(x,yy);x2.scale(s*(2-sq),s*sq);x2.drawImage(sp,-12,-9);x2.restore();}
function petCanvas(id,sz,s,t){const k=el('canvas');k.width=k.height=sz;const x=k.getContext('2d');drawPet(x,id,sz/2,sz/2+4,s,t||0);return k;}
function rollPet(kind){const o=EGGS[kind].o;let q=Math.random()*100,r=0;for(let i=0;i<3;i++){if(q<o[i]){r=i;break;}q-=o[i];}const pool=Object.keys(PETS).filter(k=>PETS[k].r===r);return pool[Math.floor(Math.random()*pool.length)];}
function givePet(id){const dup=S.pets.includes(id);if(dup)S.coins+=Math.round(PETS[id].p*.4)||50;else{S.pets.push(id);if(!S.pet)S.pet=id;}save();return dup;}
function showHatch(id,dup,kind){const h=$('hatch'),E=EGGS[kind]||EGGS.g;panelOpen=true;h.hidden=false;h.innerHTML='';const eg=el('div','egg');eg.style.setProperty('--e1',E.e[0]);eg.style.setProperty('--e2',E.e[1]);h.append(el('div','','HATCHING...'),eg);
  setTimeout(()=>eg.classList.add('fast'),1100);beep(300,.4,'square',.04,300);
  setTimeout(()=>{eg.classList.add('pop');beep(1100,.3,'triangle',.07,600);},1900);
  setTimeout(()=>{h.innerHTML='';const p=PETS[id],rc=RAR[p.r][1],t1=el('div','',dup?'DUPLICATE!':'NEW PET!');t1.style.color=dup?'#ff9aa8':'#6fe3b8';t1.style.fontSize='14px';
    const cv2=petCanvas(id,150,5.8,0),nm=el('div','',p.n);nm.style.cssText='font-size:16px;color:'+rc;const rr=el('div','',RAR[p.r][0]);rr.style.color=rc;
    const pk=el('div','',dup?'+'+(Math.round(p.p*.4)||50)+' COINS BACK':PK[p.pk]);pk.style.cssText='font-size:8px;color:#9fe7ff;line-height:1.8';
    const bt=el('button','alt','AWESOME');bt.style.cssText='width:80%;padding:14px';bt.onclick=()=>{h.hidden=true;if(!passOpen&&!evOpen)panelOpen=!panel.hidden;if(evOpen)renderEvt();renderPanel();};
    h.append(t1,cv2,nm,rr,pk,bt);},2350);}
function hatch(kind,free){const E=EGGS[kind];if(!free){if(S.coins<E.p)return;S.coins-=E.p;}const id=rollPet(kind),dup=givePet(id);showHatch(id,dup,kind);}

  const have=Object.keys(PETS).filter(k=>S.pets.includes(k)).length,h=el('h3','','PETS');h.append(el('small','',have+'/'+Object.keys(PETS).length));b.append(h);
  const grid=el('div','grid');b.append(grid);

    const pv=el('div','pv');pv.append(petCanvas(id,104,3.6,0));card.append(pv,el('span','nm',p.n),el('em','need',PK[p.pk]));card.lastChild.style.color='#9fe7ff';
    const bt=el('button',eq?'on':own?'alt':'',eq?'EQUIPPED':own?'EQUIP':'');if(!own&&p.p){bt.append(el('i','coin'),' '+p.p);bt.disabled=S.coins<p.p;}else if(!own){bt.textContent='EVENT ONLY';bt.disabled=true;}else bt.disabled=eq;
    bt.onclick=()=>{if(!own){S.coins-=p.p;S.pets.push(id);}S.pet=id;save();const sc=b.scrollTop;renderPanel();b.scrollTop=sc;beep(700,.12,'square',.04,300);};card.append(bt);grid.append(card);});

/* ===== 3-day haunted event ===== */
const EV0=Math.floor(Date.UTC(2026,9,9)/864e5),EVN=3,EVM=[{at:25,c:50},{at:75,egg:'b'},{at:150,c:100},{at:250,pet:'golden'},{at:400,egg:'g'}];let evOpen=false;const evt=$('evt');
const evActive=()=>dayNum()>=EV0&&dayNum()<EV0+EVN,evLeft=()=>EV0+EVN-dayNum();
function evEnsure(){if(!S.ev||S.ev.id!=='h26')S.ev={id:'h26',pts:0,cl:[]};}
function evClaimable(){if(!evActive())return false;evEnsure();return EVM.some(m=>S.ev.pts>=m.at&&!S.ev.cl.includes(m.at));}
function drawHaunt(){const t=frame;c.fillStyle='#ff9a2a';c.beginPath();c.arc(270,120,44,0,7);c.fill();c.fillStyle='#ffc060';c.beginPath();c.arc(262,112,30,0,7);c.fill();c.fillStyle='rgba(180,80,0,.35)';c.beginPath();c.arc(282,128,8,0,7);c.arc(256,136,5,0,7);c.arc(276,100,5,0,7);c.fill();
  c.fillStyle='#120622';for(let i=0;i<5;i++){const bx=((t*(.7+i*.2)+i*130)%(W+80))-40,by=60+i*34+Math.sin(t*.08+i)*14,fl=Math.sin(t*.4+i)*6;c.beginPath();c.moveTo(bx,by);c.lineTo(bx-12,by-fl-4);c.lineTo(bx-6,by+3);c.lineTo(bx,by+1);c.lineTo(bx+6,by+3);c.lineTo(bx+12,by-fl-4);c.closePath();c.fill();}
  c.fillStyle='rgba(200,150,255,.12)';for(let i=0;i<4;i++)c.fillRect(0,GROUND-70+i*14+Math.sin(t*.02+i)*5,W,12);}
function evGive(m){if(m.c)S.coins+=m.c;if(m.egg){save();evClose();hatch(m.egg,true);return;}if(m.pet){givePet(m.pet);if(!S.pet)S.pet=m.pet;}}
function renderEvt(){evEnsure();evt.innerHTML='';const p=S.ev.pts,h=el('div','ph','HAUNTED NIGHT');h.append(el('small','',evLeft()+(evLeft()===1?' DAY':' DAYS')+' LEFT  |  PLAY THE EVENT MAP TO EARN PTS'));
  const pl=el('button','big','PLAY EVENT MAP');pl.onclick=()=>{evClose();evRun=true;toReady();};
  const pg=el('div','pg');pg.style.cssText='background:rgba(0,0,0,.35);border-radius:14px;padding:12px;font-size:8px';pg.append(el('span','','EVENT PTS: '+p+'  (1 PER SCORE)'));
  evt.append(h,pl,pg);
  EVM.forEach(m=>{const done=S.ev.cl.includes(m.at),ok=p>=m.at,r=el('div','row'+(done?' done':''));const lbl=m.c?'+'+m.c+' COINS':m.egg?EGGS[m.egg].n:'GOLDEN SLIME PET';r.append(el('span','',m.at+' PTS\n'+lbl));r.firstChild.style.whiteSpace='pre-line';
    const bt=el('button',ok&&!done?'':'alt',done?'DONE':ok?'CLAIM':Math.max(0,m.at-p)+' MORE');bt.disabled=done||!ok;bt.onclick=()=>{S.ev.cl.push(m.at);evGive(m);save();if(evOpen)renderEvt();beep(1040,.25,'triangle',.06,500);};r.append(bt);evt.append(r);});
  const bk=el('button','alt','BACK');bk.style.padding='14px';bk.onclick=evClose;evt.append(bk);}
function openEvt(){if(st==='play'&&!paused||!evActive())return;evOpen=true;panelOpen=true;renderEvt();evt.hidden=false;}
function evClose(){evOpen=false;panelOpen=false;evt.hidden=true;}

/* ===== real-money store (Google Play Billing via Digital Goods API) ===== */
const IAP=[{id:'coins_500',t:'500 COINS',c:500,usd:'$0.99'},{id:'coins_1500',t:'1500 COINS',c:1500,usd:'$2.99'},{id:'coins_4000',t:'4000 COINS',c:4000,usd:'$6.99'},{id:'coins_10000',t:'10000 COINS',c:10000,usd:'$14.99'},{id:'starter_pack',t:'STARTER PACK\n1000 COINS + NINJA BIRD',c:1000,bird:'ninja',usd:'$1.99',once:1},{id:'void_bundle',t:'VOID BUNDLE\n2500 COINS + VOID BIRD',c:2500,bird:'void',usd:'$4.99',once:1},{id:'boost_pack',t:'BOOST PACK\n5 OF EACH BOOST',c:0,bo:{sh:5,mag:5,dbl:5},usd:'$1.49'},{id:'coins_25000',t:'25000 COINS',c:25000,usd:'$29.99'},{id:'weekly_pass',t:'SEASON PASS',c:0,pass:1,usd:'$4.99'},{id:'remove_ads',t:'REMOVE ADS',c:0,noads:1,usd:'$3.99',once:1}];
const LB_URL='',VERIFY_URL='';
let lb=[];const uid=()=>{if(!S.uid){S.uid=Math.random().toString(36).slice(2,10);S.name='BIRD'+Math.floor(1000+Math.random()*9000);save();}return S.uid;};
async function lbPost(){if(!LB_URL||S.mode!=='daily'||!score)return;try{await fetch(LB_URL+'/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({day:dayNum(),uid:uid(),name:S.name,score})});}catch(e){}}
async function lbLoad(){if(!LB_URL)return;try{lb=await(await fetch(LB_URL+'/top?day='+dayNum())).json();if(panelOpen&&tab==='stats')renderPanel();}catch(e){}}
async function verify(id,token){if(!VERIFY_URL)return true;try{const x=await fetch(VERIFY_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,token})});return(await x.json()).ok===true;}catch(e){return false;}}
let dg=null,dgInfo={},storeMsg='',busy=false;
async function fulfil(id,token){
  const it=IAP.find(i=>i.id===id);if(!it||!token)return;
  if(!S.tokens.includes(token)){if(!await verify(id,token))return;
    S.coins+=it.c;if(it.bird&&!S.owned.includes('bird:'+it.bird))S.owned.push('bird:'+it.bird);if(it.once){S.once=S.once||[];S.once.push(id);if(id==='starter_pack')S.starter=true;}if(it.noads)S.noads=true;if(it.pass){ensurePass();S.pass.prem=true;}if(it.bo)for(const k in it.bo)S.bo[k]+=it.bo[k];
    S.tokens.push(token);S.tokens=S.tokens.slice(-50);save();bar();
  }
  try{await dg.consume(token);}catch(e){}
}
async function initBilling(){
  try{
    if(!window.getDigitalGoodsService)return;
    const svc=await window.getDigitalGoodsService('https://play.google.com/billing');
    const d=await svc.getDetails(IAP.map(i=>i.id));
    dg=svc;
    d.forEach(x=>{try{dgInfo[x.itemId]=new Intl.NumberFormat(undefined,{style:'currency',currency:x.price.currency}).format(x.price.value);}catch(e){}});
    for(const p of await svc.listPurchases())await fulfil(p.itemId,p.purchaseToken);
    if(panelOpen&&tab==='store')renderPanel();
  }catch(e){dg=null;}
}
async function buy(it){
  if(!dg||busy)return;busy=true;storeMsg='';renderPanel();
  try{
    const req=new PaymentRequest([{supportedMethods:'https://play.google.com/billing',data:{sku:it.id}}]);
    const res=await req.show();
    const token=res.details&&res.details.purchaseToken;
    await res.complete('success');
    await fulfil(it.id,token);
    storeMsg='THANK YOU!'+(it.c?' +'+it.c+' COINS':'');beep(1040,.25,'triangle',.06,500);
  }catch(e){storeMsg='PURCHASE CANCELLED';}
  busy=false;renderPanel();if(passOpen)renderPass();
}
